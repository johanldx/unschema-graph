name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/package.json'
      - 'packages/**/CHANGELOG.md'

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create aggregate v1 release
        if: steps.changesets.outputs.published == 'true' && fromJSON(steps.changesets.outputs.publishedPackages)[0].version == '1.0.0'
        run: gh release create v1.0.0 --target "$GITHUB_SHA" --title "unschema-graph v1.0.0" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
